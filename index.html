<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NAMEVERSE — 당신의 이름은 이미 하나의 행성입니다</title>
  <meta name="description" content="이름을 입력하면 우주 어딘가에서 그 이름으로만 존재하는 행성을 찾아냅니다. 지형, 대기, 고리, 위성, 역사, 그리고 주제가까지." />
  <meta property="og:title" content="NAMEVERSE — 당신의 이름은 이미 하나의 행성입니다" />
  <meta property="og:description" content="같은 이름은 전 세계 어디서나 같은 행성이 됩니다. 당신의 행성을 찾아보세요." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#03030a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='35%25'%3E%3Cstop offset='0' stop-color='%23b9f3ff'/%3E%3Cstop offset='1' stop-color='%232b3bd1'/%3E%3C/radialGradient%3E%3C/defs%3E%3Cellipse cx='32' cy='34' rx='30' ry='8' fill='none' stroke='%23ffd79a' stroke-width='3' transform='rotate(-18 32 34)'/%3E%3Ccircle cx='32' cy='32' r='17' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="mode-intro">
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="planet" aria-label="행성 뷰어: 드래그해서 회전, 클릭해서 지표 탐사"></canvas>

  <header class="topbar">
    <a class="brand" href="#" id="brand" aria-label="처음으로">NAME<span>VERSE</span></a>
    <div class="top-actions">
      <button class="chip" id="btn-sound" aria-pressed="false" title="행성의 노래 (M)">
        <span aria-hidden="true">♪</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lbl">소리 끔</span>
      </button>
      <button class="chip" id="btn-atlas">은하 도감 <b id="atlas-count">0</b></button>
    </div>
  </header>

  <!-- 1. 입장 -->
  <section id="intro" class="intro">
    <p class="eyebrow">이름의 우주 관측소 · Observatory of Names</p>
    <h1>당신의 이름은<br /><em>이미 하나의 행성</em>입니다</h1>
    <p class="lead">
      이름을 입력하면 우주 어딘가에서 그 이름으로만 존재하는 행성을 찾아냅니다.<br />
      같은 이름은 <b>전 세계 어디서나 같은 행성</b>이 됩니다.
    </p>
    <form id="form" class="namebox" autocomplete="off">
      <input id="name" maxlength="24" placeholder="이름을 입력하세요" aria-label="이름" spellcheck="false" />
      <button type="submit" class="cta">행성 찾기 <span aria-hidden="true">→</span></button>
    </form>
    <p class="hint" id="live-hint">한 글자씩 입력할 때마다 지평선 너머의 행성이 바뀝니다</p>
    <div class="examples" id="examples"></div>
  </section>

  <!-- 2. 관측 중 -->
  <section id="scan" class="scan" hidden>
    <div class="scan-rings" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="scan-name" id="scan-name"></p>
    <p class="scan-line" id="scan-line"></p>
    <p class="scan-coord" id="scan-coord"></p>
  </section>

  <!-- 3. 행성 정보 -->
  <aside id="panel" class="panel" hidden></aside>

  <!-- 4. 궁합 -->
  <div id="duo-labels" class="duo-labels" hidden></div>
  <aside id="duo-panel" class="duo-panel" hidden></aside>

  <!-- 지표 탐사 -->
  <div id="probe-marker" class="probe-marker" hidden></div>
  <div id="probe" class="probe" hidden role="status"></div>

  <!-- 은하 도감 -->
  <aside id="atlas" class="drawer" hidden aria-label="은하 도감">
    <div class="drawer-head">
      <h3>나의 은하 도감</h3>
      <button class="icon-btn" data-close="atlas" aria-label="닫기">✕</button>
    </div>
    <p class="drawer-sub">이 기기에서 발견한 행성들</p>
    <ul id="atlas-list" class="atlas-list"></ul>
    <button class="ghost small" id="atlas-clear">도감 비우기</button>
  </aside>

  <!-- 궁합 입력 -->
  <div id="modal-duo" class="modal" hidden>
    <form class="modal-card" id="duo-form" autocomplete="off">
      <h3>행성 궁합</h3>
      <p>함께 궤도를 돌 이름을 입력하세요.<br />두 행성 사이의 중력을 계산합니다.</p>
      <input id="duo-name" maxlength="24" placeholder="상대의 이름" aria-label="상대의 이름" spellcheck="false" />
      <div class="row">
        <button type="button" class="ghost" data-close="modal-duo">취소</button>
        <button type="submit" class="cta">궁합 보기</button>
      </div>
    </form>
  </div>

  <div id="hint-drag" class="hint-drag" hidden>드래그해서 돌려 보고, 행성을 눌러 지표를 탐사해 보세요</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><div class="nojs">NAMEVERSE를 보려면 JavaScript가 필요합니다.</div></noscript>

  <script src="js/seed.js"></script>
  <script src="js/genesis.js"></script>
  <script src="js/surface.js"></script>
  <script src="js/planet-gl.js"></script>
  <script src="js/starfield.js"></script>
  <script src="js/music.js"></script>
  <script src="js/postcard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
