<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="planet"><circle cx="32" cy="32" r="17.5"/></clipPath>
    <clipPath id="day"><circle cx="25.5" cy="25.5" r="20"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0b1e"/>
  <g transform="rotate(-22 32 32)">
    <!-- 고리 뒤쪽 -->
    <ellipse cx="32" cy="32" rx="29" ry="8" fill="none" stroke="#e9a45c" stroke-width="4" opacity="0.5"/>
    <!-- 행성: 밤 쪽 위에 낮 쪽과 띠를 겹친다 -->
    <circle cx="32" cy="32" r="17.5" fill="#2c2550"/>
    <g clip-path="url(#planet)">
      <g clip-path="url(#day)">
        <rect x="10" y="10" width="44" height="44" fill="#f6d3a0"/>
        <path d="M10 28h44M10 36.5h44" stroke="#e3a867" stroke-width="3"/>
      </g>
    </g>
    <!-- 고리 앞쪽 -->
    <path d="M3 32a29 8 0 0 0 58 0" fill="none" stroke="#e9a45c" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
